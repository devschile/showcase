backend:
  name: github
  repo: devschile/showcase
  branch: main

local_backend:
  url: http://127.0.0.1:8081/api/v1
  allowed_hosts:
    - localhost
    - 127.0.0.1

media_folder: static/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: proyectos
    label: Proyectos
    label_singular: Proyecto
    folder: content/proyectos
    media_folder: '{{media_folder}}/{{slug}}'
    public_folder: '{{public_folder}}/{{slug}}'
    create: true
    delete: true
    extension: md
    format: toml-frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    editor:
      preview: false
    fields:
      - label: Titulo
        name: title
        widget: string

      - label: Fecha de publicacion
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: HH:mm
        format: YYYY-MM-DDTHH:mm:ssZ
        picker_utc: false

      - label: Borrador
        name: draft
        widget: boolean
        default: false
        required: false

      - label: Descripcion
        name: description
        widget: text

      - label: Tags
        name: tags
        widget: list
        required: false
        collapsed: false
        field:
          label: Tag
          name: tag
          widget: string

      - label: Metadatos
        name: params
        widget: object
        required: false
        collapsed: false
        fields:
          - label: Categoria
            name: category
            widget: select
            options:
              - Open Source
              - Evento
              - Docs
              - Emprendimiento
              - Ofrezco servicios
            required: false

          - label: Imagen principal
            name: hero_image
            widget: image
            required: false
            hint: Sube una imagen. Se guardara en /uploads/<titulo-websafe>/.

          - label: URL del proyecto
            name: project_url
            widget: string
            required: false

          - label: Contacto del proyecto
            name: contact_url
            widget: string
            required: false
            hint: Compatibilidad con contenido existente. Acepta mailto:, email o URL.

          - label: Autor
            name: author
            widget: object
            required: false
            collapsed: false
            fields:
              - label: Nombre
                name: name
                widget: string
                required: false

              - label: Rol
                name: role
                widget: string
                required: false

              - label: Avatar
                name: avatar
                widget: image
                required: false
                hint: Sube un avatar. Se guardara en /uploads/<titulo-websafe>/.

              - label: Frase
                name: quote
                widget: text
                required: false

              - label: Contacto del autor
                name: contact_url
                widget: string
                required: false
                hint: Si existe, el theme usara este valor por sobre el contacto legado del proyecto.

              - label: GitHub
                name: github_url
                widget: string
                required: false

              - label: X o Twitter
                name: twitter_url
                widget: string
                required: false

      - label: Contenido
        name: body
        widget: markdown
