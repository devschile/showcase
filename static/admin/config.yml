backend:
  name: github
  repo: devschile/showcase
  branch: main
  auth_scope: repo
  open_authoring: true

publish_mode: editorial_workflow
local_backend:
  url: http://localhost:8081/api/v1

logo_url: /logo-showcase.png

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

media_folder: static/uploads
public_folder: /uploads

locale: es

collections:
  - name: proyectos
    label: Proyectos
    label_singular: Proyecto
    folder: content/proyectos
    create: true
    publish: false
    delete: false
    extension: md
    format: toml-frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    editor:
      preview: false
    fields:
      - label: Título
        name: title
        widget: string
        required: true

      - label: Tu usuario de GitHub
        name: owner_github
        widget: hidden
        required: false
        default: ""

      - label: Fecha
        name: date
        widget: datetime
        required: true
        date_format: YYYY-MM-DD
        time_format: HH:mm
        format: YYYY-MM-DDTHH:mm:ssZ
        picker_utc: false

      - label: Borrador
        name: draft
        widget: boolean
        default: false
        required: true

      - label: Descripción corta
        name: description
        widget: text
        required: true

      - label: Tags
        name: tags
        widget: list
        required: false

      - label: Contenido (explica tu proyecto libremente)
        name: body
        widget: markdown
        required: true

      - label: Datos del proyecto
        name: params
        widget: object
        required: false
        fields:
          - label: Categoría (por ejemplo Open Source, Emprendimiento, Evento)
            name: category
            widget: string
            required: false

          - label: Imagen Principal (URL, tamaño recomendado 1600x800px)
            name: hero_image
            widget: string
            required: false
            hint: "Pega la URL pública de la imagen (ej: https://i.imgur.com/imagen.png)."

          - label: URL Proyecto
            name: project_url
            widget: string
            required: false

          - label: Contacto del proyecto (URL)
            name: contact_url
            widget: string
            required: false

          - label: Autor
            name: author
            widget: object
            required: false
            fields:
              - label: Nombre
                name: name
                widget: string
                required: true

              - label: Rol
                name: role
                widget: string
                required: false

              - label: Avatar
                name: avatar
                widget: string
                required: false
                hint: "URL pública del avatar."

              - label: Frase
                name: quote
                widget: text
                required: false

              - label: Contacto (URL)
                name: contact_url
                widget: string
                required: false

              - label: GitHub
                name: github_url
                widget: string
                required: false

              - label: Twitter / X
                name: twitter_url
                widget: string
                required: false
